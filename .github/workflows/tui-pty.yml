# TUI in a real terminal (ATO-658).
#
# Runs src/tui/pty/: the built `atag tui` under node-pty with an
# @xterm/headless screen, checking what ink-testing-library cannot see
# (alternate screen, mouse reporting, resize, the terminal state left after
# exit). node-pty is native and both packages are test-only, so they are
# installed here with --no-save instead of living in package.json; the
# normal suite skips these tests when they are absent.
#
# No secrets needed. Windows is left out: ConPTY has no SIGTERM, and the
# signal tests are half of the point.

name: TUI (real terminal)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/tui/**"
      - "src/cli/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tui-pty.yml"
  workflow_dispatch:

concurrency:
  group: tui-pty-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pty:
    name: tui pty (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.7"
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the PTY test packages
        run: npm install --no-save --no-audit --no-fund node-pty@1.1.0 @xterm/headless@6.0.0

      - name: Confirm the packages load
        # The tests skip silently without them; here that would be a false green.
        run: node -e "require('node-pty'); require('@xterm/headless'); console.log('node-pty and @xterm/headless load')"

      - name: Build
        run: npm run build

      - name: Real-terminal TUI tests
        env:
          ATOMIC_AGENT_PTY_TESTS: "1"
        run: npx vitest run src/tui/pty
