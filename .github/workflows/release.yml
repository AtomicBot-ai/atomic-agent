# SEA release: build per-target Node SEA CLI, sign+notarize macOS, sign Windows, build the Linux
# deb/rpm from the Linux bundles, upload a draft GitHub Release, and smoke the packages against the
# draft in clean distro containers. Publishing the draft (by hand, on GitHub) starts
# linux-repo.yml, which brings the apt/dnf repository and the AUR package up to the release.
#
# macOS secrets (match openclaw / electron-desktop): MACOS_CSC_LINK, MACOS_CSC_KEY_PASSWORD,
# NOTARYTOOL_KEY, NOTARYTOOL_KEY_ID, NOTARYTOOL_ISSUER
# Windows code-signing secrets (DigiCert KeyLocker, match electron-desktop): SM_API_KEY,
# SM_CLIENT_CERT_FILE_B64, SM_CLIENT_CERT_PASSWORD, SM_CODE_SIGNING_CERT_SHA1_HASH
# Linux packages (the key is shared with atc / eye-cli): LINUX_PACKAGES_GPG_KEY (the armored
# private key of packaging/atomic-chat.asc), LINUX_PACKAGES_GPG_PASSPHRASE

name: Release (SEA)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create draft GitHub Release and upload artifacts"
        required: false
        default: false
        type: boolean
      allow_unsigned:
        description: "Dry run: build the Linux packages without the packages key (never for a tag)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.slug }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15, not macos-14: GitHub retires the macos-14 image (brown-out
          # windows from 5-6 Oct 2026, gone 2 Nov), and a release cut in one of
          # those windows would lose its Mac build (ATO-114). Node comes from
          # setup-node and native addons build against Node's own minimum macOS,
          # so the newer runner does not raise what the binary needs.
          - { slug: darwin-arm64, os: macos-15 }
          - { slug: linux-x64, os: ubuntu-22.04 }
          # win32-x64 re-enabled after the Windows path bug in the build
          # scripts (`new URL(...).pathname` → `fileURLToPath`) was fixed.
          # windows-2022 ships MSVC build tools so `better-sqlite3` rebuilds
          # natively during `npm ci`.
          - { slug: win32-x64, os: windows-2022 }
          # linux-arm64 re-enabled (#43): GitHub-hosted ubuntu-24.04-arm is
          # available; BUNDLE_TARGETS / install.sh / fetch-assets already know
          # the slug. Without this job the one-line installer 404s on ARM Linux.
          - { slug: linux-arm64, os: ubuntu-24.04-arm }
          # Still disabled (runner-availability / cost; out of scope for #43):
          # - { slug: darwin-x64, os: macos-13 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node >= 25.7 introduced `"mainFormat": "module"` for Node SEA
          # (#61813). Our CLI bundle is ESM due to top-level await in `ink`
          # and other deps, so SEA must run it as an ES module. Node 22/24
          # LTS would crash at boot with `SyntaxError: Cannot use import
          # statement outside a module`.
          node-version: "25.7"
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Bundle CLI for SEA
        env:
          # Enables Sentry sourcemap upload in scripts/bundle-sea.ts; absent
          # on forked-PR runs (no secrets access), which is the intended
          # local/dev-parity fallback (build succeeds, upload just skips).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run bundle:sea

      - name: Fetch runtime assets (ripgrep for host)
        run: npm run bundle:fetch-assets

      - name: Build Node SEA binary
        run: npm run bundle:build-binary

      - name: Raise file descriptor limit (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "Before: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          sudo launchctl limit maxfiles 524288 524288 2>/dev/null || true
          ulimit -n 524288
          echo "After: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"

      - name: Write notary API key to file (macOS)
        if: runner.os == 'macOS'
        run: |
          if [[ -n "${NOTARYTOOL_KEY_CONTENT}" ]]; then
            KEY_PATH="${RUNNER_TEMP}/notary-key.p8"
            echo "$NOTARYTOOL_KEY_CONTENT" > "$KEY_PATH"
            chmod 600 "$KEY_PATH"
            echo "NOTARYTOOL_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          fi
        env:
          NOTARYTOOL_KEY_CONTENT: ${{ secrets.NOTARYTOOL_KEY }}

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
        run: |
          chmod +x scripts/sign-mac-binary.sh
          ulimit -n 524288 2>/dev/null || true
          "./scripts/sign-mac-binary.sh" "bundle/${{ matrix.slug }}/atomic-agent"

      - name: Notarize (macOS)
        if: runner.os == 'macOS'
        env:
          # NOTARYTOOL_KEY path (file) is appended to GITHUB_ENV in the write step
          NOTARIZE: ${{ secrets.NOTARYTOOL_KEY != '' && secrets.MACOS_CSC_LINK != '' && '1' || '0' }}
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
        run: |
          chmod +x scripts/notarize-mac-binary.sh
          if [[ "${NOTARIZE}" != "1" ]]; then
            echo "Skipping notarization (missing notary and/or Apple signing secrets)"
            exit 0
          fi
          if [[ -z "${NOTARYTOOL_KEY:-}" ]]; then
            echo "NOTARYTOOL_KEY not set; skipping notarization"
            exit 0
          fi
          "./scripts/notarize-mac-binary.sh" "bundle/${{ matrix.slug }}/atomic-agent"

      # --- Windows code signing (DigiCert KeyLocker) -----------------------------
      # We sign the SOURCE files BEFORE `Package bundle` copies them into the zip.
      # PE Authenticode signatures live inside the file and survive a plain copy,
      # so signing here yields a fully signed archive without splitting the
      # stage/archive step. Targets: the SEA binary (already at bundle/<slug>/),
      # plus the ripgrep and better-sqlite3 sources that package-bundle.ts pulls
      # into vendor/ and node_modules/ later.
      - name: Setup DigiCert KeyLocker (Windows)
        if: matrix.slug == 'win32-x64'
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
        run: |
          $headers = @{ "x-api-key" = $env:SM_API_KEY }
          $smctlUrl = "https://one.digicert.com/signingmanager/api-ui/v1/releases/smtools-windows-x64.msi/download"
          Invoke-WebRequest -Uri $smctlUrl -Headers $headers -OutFile smtools.msi
          Start-Process msiexec.exe -ArgumentList "/i", "smtools.msi", "/quiet", "/norestart" -Wait

          $smctlPath = "C:\Program Files\DigiCert\DigiCert One Signing Manager Tools"
          echo "$smctlPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $certBytes = [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64)
          $certPath = "$env:RUNNER_TEMP\digicert_client_cert.p12"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "SM_CLIENT_CERT_FILE=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify DigiCert KeyLocker setup (Windows)
        if: matrix.slug == 'win32-x64'
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: https://clientauth.one.digicert.com
        run: smctl healthcheck

      - name: Sync certificates to Windows Store (Windows)
        if: matrix.slug == 'win32-x64'
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_HOST: https://clientauth.one.digicert.com
        run: smctl windows certsync

      - name: Setup Windows SDK signtool (Windows)
        if: matrix.slug == 'win32-x64'
        shell: pwsh
        run: |
          $signtoolPath = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Sort-Object { [version]($_.FullName -replace '.*\\(\d+\.\d+\.\d+\.\d+)\\.*', '$1') } -Descending |
            Select-Object -First 1

          if ($signtoolPath) {
            $signtoolDir = $signtoolPath.DirectoryName
            Write-Host "Found signtool at: $signtoolDir"
            echo "$signtoolDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Error "signtool.exe not found in Windows SDK"
            exit 1
          }

      - name: Sign Windows binaries with DigiCert KeyLocker
        if: matrix.slug == 'win32-x64'
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
          SM_HOST: https://clientauth.one.digicert.com
        run: |
          $ErrorActionPreference = "Stop"
          $targets = @()

          # SEA binary — signed in place; package-bundle.ts archives this dir as-is.
          $sea = "bundle\win32-x64\atomic-agent.exe"
          if (-not (Test-Path $sea)) {
            Write-Error "SEA binary not found at $sea"
            exit 1
          }
          $targets += (Get-Item $sea).FullName

          # ripgrep source — package-bundle copies it into vendor/rg.exe later.
          $rg = "assets\ripgrep\win32-x64\rg.exe"
          if (Test-Path $rg) { $targets += (Get-Item $rg).FullName }

          # better-sqlite3 native addon source — copied into node_modules/ later.
          $sqlite = Get-ChildItem -Path "node_modules\better-sqlite3\build\Release" -Filter "*.node" -ErrorAction SilentlyContinue
          foreach ($f in $sqlite) { $targets += $f.FullName }

          # signtool is a native command, so a failure sets $LASTEXITCODE but does
          # not trip $ErrorActionPreference. Check it, or an unsigned binary ships
          # (v0.6.6's atomic-agent.exe did).
          Write-Host "Signing $($targets.Count) binaries"
          foreach ($t in $targets) {
            Write-Host "Signing: $t"
            signtool sign /sha1 $env:SM_CODE_SIGNING_CERT_SHA1_HASH /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 "$t"
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign failed for $t"; exit 1 }
            signtool verify /pa "$t"
            if ($LASTEXITCODE -ne 0) { Write-Error "signtool verify failed for $t"; exit 1 }
          }
      # --- end Windows code signing ---------------------------------------------

      - name: Package bundle
        run: npx tsx scripts/package-bundle.ts "${{ matrix.slug }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: bundle/atomic-agent-${{ matrix.slug }}*
          if-no-files-found: error
          retention-days: 14

  # The deb and rpm of this run's Linux bundles: the very archives `build` uploaded, extracted under
  # /usr/lib/atomic-agent, nothing rebuilt (scripts/linux-packages.ts, packaging/nfpm.yaml). Each
  # package depends on the glibc its binary and native addon require, read from the ELF files. The
  # rpm is signed with the packages key; a run by hand may set allow_unsigned, a tag never does.
  packages:
    name: linux packages (deb, rpm)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ALLOW_UNSIGNED: ${{ github.ref_type != 'tag' && inputs.allow_unsigned && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.7"
          check-latest: true

      - name: Install dependencies (tsx only; no native builds)
        run: npm ci --ignore-scripts

      - name: Download the Linux bundles
        uses: actions/download-artifact@v4
        with:
          path: bundle
          pattern: release-linux-*
          merge-multiple: true

      - name: Install nfpm (pinned, checksum checked)
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfpm.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" nfpm
          sudo install "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm

      - name: Import the packages key (must be packaging/atomic-chat.asc)
        if: env.ALLOW_UNSIGNED != '1'
        env:
          KEY: ${{ secrets.LINUX_PACKAGES_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "::error::the LINUX_PACKAGES_GPG_KEY secret is not set"; exit 1; fi
          file="$RUNNER_TEMP/packages-key.asc"
          (umask 077; printf '%s\n' "$KEY" > "$file")
          fpr() { gpg --show-keys --with-colons "$1" | awk -F: '/^fpr:/ {print $10; exit}'; }
          if [ "$(fpr "$file")" != "$(fpr packaging/atomic-chat.asc)" ]; then
            echo "::error::LINUX_PACKAGES_GPG_KEY is not the key in packaging/atomic-chat.asc"; exit 1
          fi
          echo "RPM_SIGNING_KEY_FILE=$file" >> "$GITHUB_ENV"

      - name: Determine version
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(node -p "require('./package.json').version")"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the packages
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.LINUX_PACKAGES_GPG_PASSPHRASE }}
        run: npx tsx scripts/linux-packages.ts build --version "$VERSION" --archives bundle --out dist/pkg

      - name: Check the rpm signatures
        if: env.ALLOW_UNSIGNED != '1'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq rpm >/dev/null
          db="$RUNNER_TEMP/rpmdb"
          mkdir -p "$db"
          rpmkeys --dbpath "$db" --import packaging/atomic-chat.asc
          for rpm in dist/pkg/*.rpm; do
            out="$(rpmkeys --dbpath "$db" --checksig "$rpm")"
            echo "$out"
            case "$out" in *'signatures OK'*) ;; *) echo "::error::$rpm is not signed by the packages key"; exit 1 ;; esac
          done

      # `release-*` like the bundles, so the release job's merged download picks them up.
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/pkg/atomic-agent_*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish draft release
    needs: [build, packages]
    if: success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          # A published release is immutable here: uploading with --clobber onto one would silently
          # replace the binaries people install (it did, once, for a manual run whose package.json
          # version was already released). Only a draft takes assets; a missing release becomes one.
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; refusing to replace its assets. Bump package.json or push a new tag."
              exit 1
            fi
            echo "Draft $TAG exists; replacing its assets"
          else
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi
          cd release-assets
          ls -la
          for f in *; do
            if [[ -f "$f" ]]; then
              echo "Uploading: $f"
              gh release upload "$TAG" "$f" --clobber
            fi
          done
          echo "Draft release: $TAG (review and publish on GitHub)"

  # Each package of the draft, installed the way README.md says in a clean container of the distro:
  # apt and dnf from a repository of the draft served on loopback (its metadata signed with a
  # throwaway key; the rpm signatures checked against packaging/atomic-chat.asc), Arch by building
  # the AUR PKGBUILD against the draft's files. scripts/smoke-linux-package.sh holds the checks. A
  # red job here means: do not publish the draft. The oldest images are what the packages' glibc
  # floor (2.34, set by better_sqlite3.node) admits: Debian 12 and Rocky 9.
  smoke-packages:
    name: smoke packages (${{ matrix.image }}, ${{ matrix.runner }})
    needs: release
    # A draft and its assets are visible only with write access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, image: "debian:12", manager: apt }
          - { runner: ubuntu-24.04, image: "ubuntu:24.04", manager: apt }
          - { runner: ubuntu-24.04, image: "fedora:44", manager: dnf }
          - { runner: ubuntu-24.04, image: "rockylinux/rockylinux:9", manager: dnf }
          - { runner: ubuntu-24.04, image: "archlinux:latest", manager: pacman }
          - { runner: ubuntu-24.04-arm, image: "debian:12", manager: apt }
          - { runner: ubuntu-24.04-arm, image: "fedora:44", manager: dnf }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TAG: ${{ needs.release.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      IMAGE: ${{ matrix.image }}
      MANAGER: ${{ matrix.manager }}
      ALLOW_UNSIGNED: ${{ github.ref_type != 'tag' && inputs.allow_unsigned && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.7"
          check-latest: true

      - name: Install dependencies (tsx only; no native builds)
        run: npm ci --ignore-scripts

      - name: Fetch the draft's packages and Linux bundles
        run: |
          set -euo pipefail
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl -p 'atomic-agent_*' -p 'atomic-agent-linux-*'
          ls -la dl

      - name: Serve a repository of the draft's packages on loopback
        if: matrix.manager != 'pacman'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c >/dev/null
          gpg --batch --passphrase '' --quick-gen-key 'atomic-agent smoke <smoke@invalid>' rsa3072 sign 1d
          fpr() { gpg --show-keys --with-colons "$1" | awk -F: '/^fpr:/ {print $10; exit}'; }
          smoke="$(gpg --list-keys --with-colons smoke@invalid | awk -F: '/^fpr:/ {print $10; exit}')"
          keys="$smoke"
          flags=()
          if [ "$ALLOW_UNSIGNED" = 1 ]; then
            flags+=(--unsigned-packages)
          else
            gpg --batch --import packaging/atomic-chat.asc
            keys="$keys,$(fpr packaging/atomic-chat.asc)"
          fi
          npx tsx scripts/linux-repo.ts build --assets dl --key "$smoke" --publish-keys "$keys" --out site \
            --base-url http://127.0.0.1:8766 "${flags[@]}"
          npx tsx scripts/linux-repo.ts readme --block "$MANAGER" --base-url http://127.0.0.1:8766 > install-commands.sh
          python3 -m http.server 8766 --bind 127.0.0.1 --directory site >/dev/null 2>&1 &
          sleep 2

      - name: Render the AUR PKGBUILD against the draft's files
        if: matrix.manager == 'pacman'
        run: npx tsx scripts/linux-packages.ts pkgbuild --version "$VERSION" --archives dl --source-base file:///w/dl --out aur

      - name: Install and check in the container
        run: |
          set -euo pipefail
          input=/w/install-commands.sh
          if [ "$MANAGER" = pacman ]; then input=/w/aur; fi
          docker run --rm --network host -v "$PWD:/w:ro" "$IMAGE" sh /w/scripts/smoke-linux-package.sh "$MANAGER" "$VERSION" "$input"
