# Known security advisories in the packages we ship (ATO-1415).
#
# Reads only the lockfile against the npm advisory database, so it needs no install. Dev-only
# packages (vitest, esbuild, ...) are left out: they never reach users. A high or critical
# advisory fails the check; fix it with a patch-level bump or an `overrides` entry in
# package.json, the way PR #1079 did.
#
# Kept out of the Test workflow on purpose. The advisory database changes on its own, so a
# check on every PR would turn unrelated PRs red the day a new advisory lands. On PRs it runs
# only when the dependency files change; new advisories against main are caught by the push
# and weekly runs instead.

name: Audit

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/audit.yml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.7"
          check-latest: true

      - name: Audit the lockfile
        run: npm audit --package-lock-only --omit=dev --audit-level=high
