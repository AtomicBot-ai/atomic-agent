<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="motion:duration" content="5">
<meta name="motion:fps" content="30">
<title>Big number</title>
<!--
  Big number / stat, 5 s. Frame contract: see ../SKILL.md.
  Params (URL query): value (for example 6.4 or 12000), prefix, suffix,
  label, caption (source of the number), brand, accent, ink,
  bg (2 or 3 hex colours separated by commas, no #), w, h, t.
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  body { background: #eef6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  #stage { position: relative; overflow: hidden; }
  .ring { position: absolute; left: 50%; top: 46%; border-radius: 50%; border-style: solid; box-sizing: border-box; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8%; box-sizing: border-box; }
  .number { font-size: 26rem; font-weight: 800; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .label { font-size: 6rem; font-weight: 700; margin-top: 2.4rem; line-height: 1.15; }
  .caption { font-size: 3rem; font-weight: 500; margin-top: 2.4rem; opacity: .7; }
  .brand { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: 7%; font-size: 3rem; font-weight: 700; padding: 1rem 2.6rem; border-radius: 99rem; background: rgba(255,255,255,.8); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div class="ring" id="r0"></div><div class="ring" id="r1"></div>
  <div class="center">
    <div class="number" id="number"></div>
    <div class="label" id="label"></div>
    <div class="caption" id="caption"></div>
  </div>
  <div class="brand" id="brand"></div>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  function P(k, d) { var v = q.get(k); return v === null ? d : v; }
  function hex(v, d) { v = String(v || "").replace(/^#/, ""); return /^[0-9a-fA-F]{3,8}$/.test(v) ? "#" + v : d; }
  var W = +P("w", 1920) || 1920, H = +P("h", 1080) || 1080;
  var DURATION = 5;
  var accent = hex(P("accent", ""), "#4f6bff");
  var ink = hex(P("ink", ""), "#1f2547");
  var bg = P("bg", "e4f1ff,fde7ff,e6fff4").split(",").map(function (c, i) { return hex(c, ["#e4f1ff", "#fde7ff", "#e6fff4"][i % 3]); });
  while (bg.length < 3) bg.push(bg[bg.length - 1]);

  var stage = document.getElementById("stage");
  stage.style.width = W + "px"; stage.style.height = H + "px";
  document.documentElement.style.fontSize = (Math.min(W, H) / 108) + "px";
  document.body.style.background = bg[0];
  stage.style.color = ink;

  var raw = String(P("value", "6.4")).replace(/,/g, "");
  var target = parseFloat(raw);
  if (!isFinite(target)) target = 0;
  var decimals = (raw.split(".")[1] || "").length;
  var prefix = P("prefix", ""), suffix = P("suffix", "x");
  var numberEl = document.getElementById("number");
  numberEl.style.color = accent;
  document.getElementById("label").textContent = P("label", "faster");
  var captionEl = document.getElementById("caption");
  captionEl.textContent = P("caption", "");
  var brandEl = document.getElementById("brand");
  brandEl.textContent = P("brand", "Atomic Agent");
  if (!brandEl.textContent) brandEl.style.display = "none";
  var rings = [0, 1].map(function (i) {
    var r = document.getElementById("r" + i);
    r.style.borderColor = i ? "#ffb020" : accent;
    return r;
  });

  function clamp(x) { return Math.min(1, Math.max(0, x)); }
  function prog(t, s, e) { return clamp((t - s) / (e - s)); }
  function easeOut(p) { return 1 - Math.pow(1 - p, 3); }
  function easeOutExpo(p) { return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); }
  function back(p) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function format(n) {
    var s = Math.abs(n).toFixed(decimals);
    var parts = s.split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return (n < 0 ? "-" : "") + parts.join(".");
  }
  function show(el, p, dy) { el.style.opacity = p; el.style.transform = "translateY(" + (dy * (1 - p)) + "rem)"; }

  function render(t) {
    t = Math.max(0, Math.min(DURATION, +t || 0));
    var a = t * 0.4;
    stage.style.background = "linear-gradient(" + (135 + Math.sin(a) * 20) + "deg," + bg[0] + "," + bg[1] + " 55%," + bg[2] + ")";
    rings.forEach(function (r, i) {
      var p = easeOut(prog(t, 0.3 + i * 0.25, 1.8 + i * 0.25));
      var size = Math.min(W, H) * (0.5 + 0.4 * p + 0.03 * Math.sin(t * 2 + i));
      r.style.width = r.style.height = size + "px";
      r.style.marginLeft = r.style.marginTop = (-size / 2) + "px";
      r.style.borderWidth = (Math.min(W, H) / 108) * (1.6 - i * 0.6) + "px";
      r.style.opacity = 0.5 * p;
    });
    var c = prog(t, 0.4, 2.0);
    numberEl.textContent = prefix + format(target * easeOutExpo(c)) + suffix;
    numberEl.style.opacity = clamp(c * 4);
    numberEl.style.transform = "scale(" + (0.85 + 0.15 * back(prog(t, 0.4, 1.1))) + ")";
    show(document.getElementById("label"), easeOut(prog(t, 1.6, 2.2)), 3);
    show(captionEl, easeOut(prog(t, 2.3, 2.9)) * 0.7, 2);
    show(brandEl, easeOut(prog(t, 2.8, 3.4)), 2);
  }

  window.__duration = DURATION;
  window.__fps = 30;
  window.__setTime = render;
  render(0);
  function ready() { window.__ready = true; document.documentElement.setAttribute("data-ready", "1"); }
  if (q.has("t")) { render(+q.get("t")); ready(); return; }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(ready);
  if (q.get("autoplay") === "0") return;
  var start = null;
  function loop(now) {
    if (window.__frozen) return;
    if (start === null) start = now;
    render(((now - start) / 1000) % (DURATION + 1));
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  window.__setTime = function (t) { window.__frozen = true; render(t); };
})();
</script>
</body>
</html>
