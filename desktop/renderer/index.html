<body>
<div id="desktop">
  <div id="menubar"></div>
  <div id="stage">
    <div id="window">
      <div id="toolbar"></div>
      <div id="main">
        <aside id="sidebar"></aside>
        <section id="content"></section>
        <!-- ATO-1053: a file previewed beside the chat (file-preview.js draws it, render() never does). -->
        <aside id="fpreview" hidden></aside>
        <aside id="inspector"></aside>
      </div>
      <div id="console" class="hide"></div>
      <!-- Backlog 18: the download card. ATO-1185: it is the popover of the
           downloads icon in the sidebar header (dl-indicator.js), over the
           window and under #overlays, so it never moves the chat. -->
      <div id="dlcard" hidden></div>
      <div id="overlays"></div>
      <!-- ATO-1113: the Run overnight dialog and its runs card (overnight.js draws it, render() never does). -->
      <div id="overnight"></div>
      <div id="fittest"></div>
      <div id="toasts"></div>
    </div>
  </div>
</div>
