<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' file: data: blob:; connect-src 'none'; frame-src blob:; form-action 'none'; base-uri 'none'">
<title>Atomic Agent</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/popovers.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/composer.css">
<link rel="stylesheet" href="css/attachments.css">
<link rel="stylesheet" href="css/window-snapshot.css">
<link rel="stylesheet" href="css/overnight.css">
<link rel="stylesheet" href="css/file-preview.css">
<link rel="stylesheet" href="css/onboarding.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/settings-data.css">
<link rel="stylesheet" href="css/settings-llm.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/studio.css">
<link rel="stylesheet" href="css/studio-images.css">
<link rel="stylesheet" href="css/studio-video.css">
</head>
<body>
<div id="desktop">
  <div id="menubar"></div>
  <div id="stage">
    <div id="window">
      <div id="toolbar"></div>
      <div id="main">
        <aside id="sidebar"></aside>
        <section id="content"></section>
        <!-- ATO-1053: a file previewed beside the chat (file-preview.js draws it, render() never does). -->
        <aside id="fpreview" hidden></aside>
        <aside id="inspector"></aside>
      </div>
      <div id="console" class="hide"></div>
      <!-- Backlog 18: the download card. It floats in the bottom-right corner,
           over the window and under #overlays, so it never moves the chat the
           way the #dlbar strip it replaced did. -->
      <div id="dlcard" hidden></div>
      <div id="overlays"></div>
      <!-- ATO-1113: the Run overnight dialog and its runs card (overnight.js draws it, render() never does). -->
      <div id="overnight"></div>
      <div id="toasts"></div>
    </div>
  </div>
</div>
<!-- Anonymous usage analytics and error reports: first, so its error listeners see the other modules load. -->
<script src="analytics-acts.js"></script>
<script src="analytics.js"></script>
<script src="tui-parity.js"></script>
<script src="fusion-panel.js"></script>
<!-- Feature modules declare functions only; renderer.js boots the app and calls them. -->
<script src="config-patch.js"></script>
<script src="mcp-live.js"></script>
<script src="plugins-pane.js"></script>
<script src="mcp-smart-add.js"></script>
<script src="session-titles.js"></script>
<script src="context-compaction.js"></script>
<!-- ATO-569: the chat's cost and the plan's limit beside the context ring. -->
<script src="usage-meter.js"></script>
<script src="dead-engine.js"></script>
<!-- ATO-900: the memory model card says what its click did, on the card. -->
<script src="memory-model-card.js"></script>
<script src="app-update.js"></script>
<script src="starter-chat.js"></script>
<script src="upgrade-chat.js"></script>
<script src="tts.js"></script>
<script src="switch-queue.js"></script>
<script src="chat-list.js"></script>
<script src="sidebar-nav.js"></script>
<script src="chat-rename.js"></script>
<!-- ATO-1034: chat folders, kept in ~/.atomic-agent/chat-folders.json. -->
<script src="chat-folders.js"></script>
<script src="handoff.js"></script>
<script src="workspace-skills.js"></script>
<script src="project-trust.js"></script>
<script src="approval-rules.js"></script>
<script src="composer-engines.js"></script>
<script src="composio.js"></script>
<!-- ATO-859: Telegram pairing from the app, the state and the card; renderer.js wires the IPC. -->
<script src="telegram-pairing.js"></script>
<!-- ATO-900 item 6: the Telegram tab's Restart agent, its state, words and button. -->
<script src="telegram-restart.js"></script>
<script src="hf-mirror.js"></script>
<script src="attachments.js"></script>
<script src="transcribe.js"></script>
<script src="window-snapshot.js"></script>
<script src="exa-key.js"></script>
<script src="disk-space.js"></script>
<script src="model-spotlight.js"></script>
<script src="doctor-data.js"></script>
<!-- ATO-519: a new task in plain words, sent to the agent in a new chat. -->
<script src="task-ask.js"></script>
<script src="overnight.js"></script>
<!-- ATO-669: forgiving ⌘K search; fuzzysort is vendored (MIT, licence beside it). -->
<script src="vendor/fuzzysort.js"></script>
<script src="fuzzy-match.js"></script>
<!-- ATO-824: the streaming transcript is morphed, not replaced, so unchanged nodes (Copy) stay put. -->
<script src="dom-morph.js"></script>
<!-- ATO-1025: colour in a reply's code blocks (no library, the theme's tokens). -->
<script src="code-highlight.js"></script>
<!-- ATO-664: marked parses a reply's markdown, DOMPurify checks the result (both vendored, licences beside them). -->
<script src="vendor/marked.js"></script>
<script src="vendor/purify.js"></script>
<!-- ATO-1251: the reply's markdown blocks (renderMarkdown hands its text here). -->
<script src="md-render.js"></script>
<!-- ATO-1053: the file preview panel (main reads the file; this only draws it). -->
<script src="chat-files.js"></script>
<script src="file-preview.js"></script>
<!-- ATO-464: a finished turn's steps fold into one summary line. -->
<script src="turn-summary.js"></script>
<!-- ATO-1272: the transcript draws its newest part; earlier rows are one "Show earlier" row. -->
<script src="chat-window.js"></script>
<!-- ATO-486: the live plan above the composer -->
<script src="plan-bar.js"></script>
<!-- ATO-965: /status, a snapshot of the running turn. -->
<script src="status-snapshot.js"></script>
<!-- A reply's videos and the progress of long tool calls (video.generate). -->
<script src="chat-media.js"></script>
<script src="tool-failures.js"></script>
<!-- ATO-1249: the side panel's Steps and Reasoning, newest first, with a switch. -->
<script src="insp-order.js"></script>
<!-- Studio (Images, Video): the shell first, then each page registers itself with it. -->
<script src="studio/shell.js"></script>
<script src="studio/recent-prompts.js"></script>
<script src="studio/improve-prompt.js"></script>
<script src="studio/images-logic.js"></script>
<script src="studio/mask-painter.js"></script>
<script src="studio/images-view.js"></script>
<script src="studio/images.js"></script>
<script src="studio/video.js"></script>
<script src="renderer.js"></script>
</body>
</html>
